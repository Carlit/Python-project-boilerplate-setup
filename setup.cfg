[flake8]
max-line-length = 90
max-complexity = 10
extend-exclude =
    .venv,
    .git,
    __pycache__,
    build,
    dist,
    docs
# E203 : incompatible avec le formatage des slices (conflit black/PEP8)
# W503 : opérateur en début de ligne, style désormais recommandé
extend-ignore = E203, W503
per-file-ignores =
    tests/*: S101
