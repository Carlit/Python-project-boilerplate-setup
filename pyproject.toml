[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-db-boilerplate"
version = "0.1.0"
description = "Socle technique Python pour extractions et traitements PostgreSQL / Oracle."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.mypy]
# Pourquoi 3.12 alors que le projet vise 3.11+ (requires-python) : le stub
# numpy embarqué (numpy/__init__.pyi) utilise la syntaxe `type X = ...`
# (PEP 695, 3.12+) sans garde de version. Viser 3.11 fait échouer mypy au
# PARSING de ce stub tiers, avant tout mécanisme de suppression par module
# — follow_imports=skip et ignore_errors testés sur numpy et numpy.*, sans
# effet : l'erreur de syntaxe interrompt l'analyse avant que ces réglages
# ne s'appliquent.
#
# Pourquoi c'est acceptable : la compatibilité 3.11 reste vérifiée par la
# matrice CI (3.11/3.12/3.13, cf. .github/workflows/ci.yml) via pytest et
# flake8. Une syntaxe réellement 3.12+ dans le code du dépôt provoquerait
# une SyntaxError à l'import sur le job 3.11 — un échec immédiat et
# visible, pas une régression silencieuse laissée passer par mypy.
#
# À revoir quand numpy publiera des stubs compatibles 3.11, ou si le
# projet abandonne officiellement 3.11 (alors : aligner requires-python,
# la matrice CI et cette valeur sur 3.12).
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
# python-oracledb ne publie pas de stubs PEP 561 sur toutes ses versions.
module = "oracledb.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
