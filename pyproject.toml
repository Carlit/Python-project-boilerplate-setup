[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-db-boilerplate"
version = "0.1.0"
description = "Socle technique Python pour extractions et traitements PostgreSQL / Oracle."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.mypy]
# 3.12 et non 3.11 (le minimum du projet) : les stubs numpy embarqués par
# pandas-stubs utilisent la syntaxe `type X = ...` (PEP 695, 3.12+) ; viser
# 3.11 fait échouer le parsing de ces stubs tiers, indépendamment du code
# du dépôt.
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
# python-oracledb ne publie pas de stubs PEP 561 sur toutes ses versions.
module = "oracledb.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
