# ---------------------------------------------------------------------------
# Pipeline GitLab CI : qualité de code puis tests unitaires.
# Aucune dépendance à une base externe : les tests tournent hors connexion.
# ---------------------------------------------------------------------------

default:
  image: python:3.11-slim
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

stages:
  - lint
  - test

lint:flake8:
  stage: lint
  script:
    - flake8 src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:pytest:
  stage: test
  script:
    - pytest --junitxml=report.xml --cov=src --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
